<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اسم النطاق</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .domain {
            font-size: 32px;
            font-weight: bold;
            color: #111;
        }
    </style>
</head>

<body>

    <div class="domain" id="domain"></div>

    <script>
        // الحصول على اسم النطاق الحالي
        const domain = window.location.hostname;

        // عرضه في الصفحة
        document.getElementById("domain").textContent = domain;
    </script>

</body>
</html>
